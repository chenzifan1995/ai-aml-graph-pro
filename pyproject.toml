[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-aml-graph-pro"
version = "0.2.0"
description = "Graph-based AML with GNNs, baselines, explainability, and temporal splits"
authors = [{name="Your Name"}]
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
  "torch>=2.2",
  "torchmetrics>=1.3",
  "pytorch-lightning>=2.3",
  "numpy",
  "pandas",
  "scikit-learn",
  "networkx",
  "hydra-core",
  "omegaconf",
  "rich",
  "tqdm",
  "pyyaml",
  "torch-geometric"
]

[tool.setuptools.packages.find]
where = [""]
include = ["aml_graph*"]
